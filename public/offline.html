<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ออฟไลน์ — ร้านนัฐภรณ์ เชียงกลาง</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b1220; color: #e2e8f0; padding: 24px; text-align: center;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { font-size: .9rem; line-height: 1.7; color: #94a3b8; margin: 0 0 1.25rem; }
      button {
        border: 0; border-radius: .75rem; padding: .75rem 1.25rem; font-weight: 700;
        background: #2563eb; color: #fff; font-size: .9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ตอนนี้ออฟไลน์อยู่</h1>
      <p>
        อุปกรณ์ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต หน้าที่เคยเปิดไว้จะยังใช้งานได้
        ส่วนหน้านี้ต้องต่อเน็ตก่อนจึงจะโหลดได้
      </p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </div>
  </body>
</html>
