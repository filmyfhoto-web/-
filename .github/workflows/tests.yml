name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests (vitest)
        run: bun run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run E2E tests (Playwright)
        run: bun run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-delivery-receipt:
    name: E2E — delivery + receipt companion (chromium + webkit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.project }})
        run: bunx playwright install --with-deps ${{ matrix.project }}
      - name: Run delivery+receipt Playwright specs (${{ matrix.project }})
        run: bun run test:e2e:delivery-receipt -- --project=${{ matrix.project }} --reporter=list,html
        env:
          CI: 'true'
      - name: Upload report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-receipt-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
            tests/e2e/__screenshots__
          retention-days: 14