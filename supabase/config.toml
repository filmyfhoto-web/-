[functions]
  [functions.notify-dispatch]
    # Auth is enforced inside the function: cron presents x-worker-token,
    # humans must be a signed-in owner/admin. Platform JWT verification is off
    # so the pg_cron worker (which has no user JWT) can reach it.
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.line-login-code]
    verify_jwt = false
  # ฟอร์ม "ติดต่อร้าน": ลูกค้าที่ผูก LINE แล้ว (LIFF id_token) ส่งได้โดยไม่ต้องล็อกอิน
  # ตัวตนถูกยืนยันภายในฟังก์ชัน (Supabase JWT หรือ id_token) เสมอ
  [functions.contact-shop-message]
    verify_jwt = false
  [functions.line-webhook]
    verify_jwt = false
  # ฟอร์มรับงานจากกลุ่ม LINE: token อายุสั้นที่บอทสร้างคือตัวยืนยันสิทธิ์เอง
  [functions.film-intake-form]
    verify_jwt = false
  [functions.link-request-notify]
    verify_jwt = false
  [functions.log-product-view]
    verify_jwt = false
  [functions.notify-new-signup]
    verify_jwt = false
  [functions.ocr-product-name]
    verify_jwt = false
  [functions.nw-smart-import]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  # Auth handled inside: signed-in JWT (self test) or x-worker-token fan-out.
  [functions.send-web-push]
    verify_jwt = false
  # Called by the push service worker (no user JWT); ownership is proven with
  # the subscription's own endpoint + auth secret inside the function.
  [functions.push-action]
    verify_jwt = false
  [functions.order-drive-upload]
    verify_jwt = false
  [functions.nw-line-webhook]
    verify_jwt = false
  [functions.staff-line-login]
    verify_jwt = false
  [functions.line-oauth-start]
    verify_jwt = false
  # Public by design: the share token itself is the credential.
  [functions.fs-share-open]
    verify_jwt = false
  [functions.line-oauth-callback]
    verify_jwt = false
  [functions.po-review]
    verify_jwt = false
  # Public by design: LINE MyShop signs each delivery; the HMAC signature is
  # verified inside the function before anything is parsed or written.
  [functions.myshop-webhook]
    verify_jwt = false
